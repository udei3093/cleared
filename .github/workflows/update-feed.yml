name: Update Regulatory Radar

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest regulatory updates
        run: python scripts/fetch_updates.py

      - name: Commit changes if any
        run: |
          git config user.name "cleared-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/updates.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh regulatory radar $(date -u +'%Y-%m-%d')"
            git push
          else
            echo "No changes to commit."
          fi
